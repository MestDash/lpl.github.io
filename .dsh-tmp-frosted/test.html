<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; }
  .bg {
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(45deg, rgba(0,0,0,.55) 0 10px, rgba(255,255,255,.25) 10px 20px),
      linear-gradient(120deg, #2266aa, #cc6622, #33aa66, #8833aa);
  }
  .panel {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 420px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font: 700 20px sans-serif; letter-spacing: 1px;
    z-index: 1;
  }
  /* base = variant A: the current site rules (mask larger than box) */
  .panel::after {
    content: "";
    position: absolute;
    inset: -8px -16px;
    z-index: -1;
    pointer-events: none;
    background: color-mix(in srgb, #181818 20%, transparent);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    backdrop-filter: blur(12px) saturate(140%);
    border-radius: 20px;
    -webkit-mask-image: radial-gradient(130% 160% at 50% 50%, #000 60%, transparent 100%);
    mask-image: radial-gradient(130% 160% at 50% 50%, #000 60%, transparent 100%);
  }
  /* variant injected by JS: B = box-sized radial mask (100% 100% 70%),
     C = user recipe: two eased linear gradients, intersected */
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="panel">PROJECTS&nbsp;&nbsp;TEAM&nbsp;&nbsp;NEWS&nbsp;&nbsp;CONTACT</div>
  <script>
    // user recipe's eased stop lists
    const EASE = "transparent 0%, rgba(0,0,0,.08) calc(28% * .25), rgba(0,0,0,.35) calc(28% * .5), rgba(0,0,0,.75) calc(28% * .75), #000 28%";
    const EASE_END = "#000 calc(100% - 28%), rgba(0,0,0,.75) calc(100% - 28% * .75), rgba(0,0,0,.35) calc(100% - 28% * .5), rgba(0,0,0,.08) calc(100% - 28% * .25), transparent 100%";
    const DUAL = "linear-gradient(to right, " + EASE + ", " + EASE_END + "), linear-gradient(to bottom, " + EASE + ", " + EASE_END + ")";
    const v = new URLSearchParams(location.search).get('v') || 'A';
    const css =
      v === 'A' ?
      'inset:-8px -16px; -webkit-mask-image:radial-gradient(130% 160% at 50% 50%, #000 60%, transparent 100%); mask-image:radial-gradient(130% 160% at 50% 50%, #000 60%, transparent 100%);'
      : v === 'B' ?
      'inset:-10px -32px; -webkit-mask-image:radial-gradient(100% 100% at 50% 50%, #000 70%, transparent 100%); mask-image:radial-gradient(100% 100% at 50% 50%, #000 70%, transparent 100%);'
      : v === 'C' ? // user recipe, verbatim: eased dual linear + intersect, same element as backdrop-filter
      'inset:-10px -28px; -webkit-mask-image:' + DUAL + '; mask-image:' + DUAL + '; -webkit-mask-composite:source-in; mask-composite:intersect;'
      : v === 'D' ? // sanity: strong tint, NO backdrop-filter, same dual mask -> mask must show on tint
      'inset:-10px -28px; background:rgba(0,0,0,.6); -webkit-backdrop-filter:none; backdrop-filter:none; -webkit-mask-image:' + DUAL + '; mask-image:' + DUAL + '; -webkit-mask-composite:source-in; mask-composite:intersect;'
      : 'inset:-10px -32px; clip-path:inset(24px);'; // E: clip-path control (24px band unclipped)
    const s = document.createElement('style');
    s.textContent = '.panel::after{' + css + '}';
    document.head.appendChild(s);
  </script>
</body>
</html>
